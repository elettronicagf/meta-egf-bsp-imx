#@TYPE: Machine
#@NAME: EGF i.MX8MM  SOM 3SM1008M
#@SOC: i.MX8MM
#@DESCRIPTION: Machine configuration for EGF i.MX8MM 3SM1008M
#@MAINTAINER: Andrea Collamati <andrea.collamati@elettronicagf.it>

MACHINEOVERRIDES =. "mx8mm:"

require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8a/tune-cortexa53.inc
# NOTE: falcon mode disables optee!
require include/falcon-mode.inc


#MACHINE_FEATURES += "pci wifi bluetooth nxp8997-pcie nxp8997-sdio nxp9098-pcie nxp9098-sdio"

# NXP BSP can consume proprietary jailhouse and Marvell drivers
# OP-TEE is also applicable to NXP BSP, mainline BSP seems not to have
# a full support for it yet.
MACHINE_FEATURES:append:use-nxp-bsp = " jailhouse mrvl8997"
MACHINE_FEATURES:append = " wifi bluetooth nxpwifi-all-sdio"
MACHINE_FEATURES:append = " multistd-serial egf-init-service"
SERIAL_CONSOLES = "115200;ttymxc0"


PREFERRED_PROVIDER_virtual/kernel:imx8mm-egf-3sm1008m ?= "linux-imx-egf"
KERNEL_DEVICETREE = " \
       freescale/imx8mm-egf-3pb1002.dtb \
       freescale/imx8mm-egf-3hi3005.dtb \
       freescale/imx8mm-egf-3hi3001.dtb \
       freescale/imx8mm-egf-3hi3011.dtb \
       freescale/imx8mm-egf-3hi3021.dtb \
"
KERNEL_DEVICETREE_BASENAME = "${MACHINE}"

PREFERRED_PROVIDER_u-boot:imx8mm-egf-3sm1008m ?= "u-boot-imx-egf"
PREFERRED_PROVIDER_virtual/bootloader:imx8mm-egf-3sm1008m ?= "u-boot-imx-egf"

UBOOT_DTB_NAME = "imx8mm-egf-3sm1008.dtb"
UBOOT_SUFFIX = "bin"

UBOOT_CONFIG_BASENAME = "egf_3sm1008"
UBOOT_CONFIG ??= "emmc"
UBOOT_CONFIG[emmc]      = "${UBOOT_CONFIG_BASENAME}_defconfig"

SPL_BINARY = "spl/u-boot-spl.bin"

ATF_PLATFORM = "imx8mm"

IMXBOOT_TARGETS = "flash_ddr4_evk"

IMX_BOOT_SOC_TARGET = "iMX8MM"


LOADADDR = ""
UBOOT_MAKE_TARGET = "all"
IMX_BOOT_SEEK = "33"

OPTEE_BIN_EXT = "8mm"
TEE_LOAD_ADDR = "0xbe000000"

# Add additional firmware
MACHINE_FIRMWARE:append = " linux-firmware-ath10k"



DDR_FIRMWARE_NAME = " \
    ddr4_imem_1d.bin \
    ddr4_dmem_1d.bin \
    ddr4_imem_2d.bin \
    ddr4_dmem_2d.bin \
"

# Mainline BSP doesn't support DDR4 so it must be set to nxp.
# Also this machine isn't supported by u-boot-fslc but imx8mp-evk.inc already
# set the bootloader to u-boot-imx instead when NXP BSP is used.
IMX_DEFAULT_BSP = "nxp"
