#@TYPE: Machine
#@NAME: EGF i.MX 8M Plus SOM 3SM1009
#@SOC: i.MX8MP
#@DESCRIPTION: Machine configuration for EGF i.MX 8M Plus SOM 3SM1009
#@MAINTAINER: Andrea Collamati <andrea.collamati@elettronicagf.it>

MACHINEOVERRIDES =. "mx8mp:"

require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8a/tune-cortexa53.inc


#MACHINE_FEATURES += "pci wifi bluetooth nxp8997-pcie nxp8997-sdio nxp9098-pcie nxp9098-sdio"

# NXP BSP can consume proprietary jailhouse and Marvell drivers
# OP-TEE is also applicable to NXP BSP, mainline BSP seems not to have
# a full support for it yet.
MACHINE_FEATURES:append:use-nxp-bsp = " jailhouse mrvl8997"
MACHINE_FEATURES:append = " wifi bluetooth nxpwifi-all-sdio"

SERIAL_CONSOLES = "115200;ttymxc1"


PREFERRED_PROVIDER_virtual/kernel:imx8mp-egf-3sm1009 ?= "linux-imx-egf"
KERNEL_DEVICETREE = " \
    freescale/imx8mp-egf-3pb1001.dtb \
    freescale/imx8mp-egf-3hi4005.dtb \
    freescale/imx8mp-egf-3hi4011.dtb \
    freescale/imx8mp-egf-3hi4021.dtb \
    freescale/imx8mp-egf-3pb1001-rev2.dtb \
    freescale/imx8mp-egf-3hi4005-rev2.dtb \
    freescale/imx8mp-egf-3hi4011-rev2.dtb \
    freescale/imx8mp-egf-3hi4021-rev2.dtb \
    freescale/imx8mp-egf-2es1300-a01.dtb \
    freescale/imx8mp-egf-2lx1001.dtb \
    freescale/imx8mp-egf-2lx1002.dtb \
    freescale/imx8mp-egf-2lx1002-blc1248.dtb \
    freescale/imx8mp-egf-2lx1002-proto.dtb \
    freescale/imx8mp-egf-3pb1000.dtb \
    freescale/imx8mp-egf-3pb1001-10inch-upg.dtb \
"

PREFERRED_PROVIDER_u-boot:imx8mp-egf-3sm1009 ?= "u-boot-imx-egf"
PREFERRED_PROVIDER_virtual/bootloader:imx8mp-egf-3sm1009 ?= "u-boot-imx-egf"

UBOOT_DTB_NAME = "${MACHINE}.dtb"
IMX_DEFAULT_BOOTLOADER:use-nxp-bsp = "u-boot-imx"
UBOOT_SUFFIX = "bin"
UBOOT_CONFIG_BASENAME = "egf_3sm1009"
UBOOT_CONFIG ??= "emmc"
UBOOT_CONFIG[emmc] = "${UBOOT_CONFIG_BASENAME}_defconfig"

SPL_BINARY = "spl/u-boot-spl.bin"

ATF_PLATFORM = "imx8mp"

IMXBOOT_TARGETS = "flash_evk"

IMX_BOOT_SOC_TARGET = "iMX8MP"

LOADADDR = ""
UBOOT_MAKE_TARGET = "all"
IMX_BOOT_SEEK = "32"

OPTEE_BIN_EXT = "8mp"
TEE_LOAD_ADDR = "0x56000000"


# Set DDR FIRMWARE
DDR_FIRMWARE_VERSION = "202006"
DDR_FIRMWARE_NAME = " \
    lpddr4_pmu_train_1d_dmem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_1d_imem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_2d_dmem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_2d_imem_${DDR_FIRMWARE_VERSION}.bin \
"

# Mainline BSP doesn't support LPDDR4 so it must be set to nxp.
# Also this machine isn't supported by u-boot-fslc but imx8mp-evk.inc already
# set the bootloader to u-boot-imx instead when NXP BSP is used.
IMX_DEFAULT_BSP = "nxp"
