# i.MX DISTRO for Wayland with X11

require conf/distro/include/fsl-imx-base.inc

DISTRO = "fsl-imx-wayland"
DISTRO_NAME = "NXP i.MX Distro with Waylandand XWayland"

PACKAGECONFIG:append:pn-weston      = " rdp"
PACKAGECONFIG:append:pn-weston-init = " rdp"
# we want to use our custom version on image and SDK filenames suffix also
IMAGE_VERSION_SUFFIX:append = "-${EGF_DISTRO_VERSION}"
TOOLCHAIN_OUTPUTNAME:append = "-${EGF_DISTRO_VERSION}"