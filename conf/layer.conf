# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILES_DYNAMIC += " \
    qt6-layer:${LAYERDIR}/dynamic-layers/qt6-layer/*/*/*.bb \
    qt6-layer:${LAYERDIR}/dynamic-layers/qt6-layer/*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "egf-bsp-imx"
BBFILE_PATTERN_egf-bsp-imx := "^${LAYERDIR}"
BBFILE_PRIORITY_egf-bsp-imx = "10"
LAYERSERIES_COMPAT_egf-bsp-imx = "scarthgap"
